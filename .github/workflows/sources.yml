# Vérifie automatiquement les sources officielles du jeu.
# Se lance à chaque modification envoyée sur GitHub, chaque lundi matin, et à la demande (onglet Actions).
# Si une source est cassée ou n'est plus officielle, GitHub envoie un e-mail et le rapport s'affiche dans l'onglet Actions.
name: Sources officielles

on:
  push:
    paths: ['js/**', 'css/**', 'test/**', 'index.html', 'sw.js', '.github/workflows/sources.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Règles du jeu (profils, cartes, objectifs, mode Simulation)
        run: node test/check-rules.js
      - name: Lois de recettes du quinquennat (catalogue, vote, 49.3, déficit)
        run: node test/check-laws.js
      - name: Socle (bus, infobulle, cache hors ligne, balises)
        run: |
          node test/check-bus.js
          node test/check-infobulle.js
          node test/check-infobulle-dom.js
          node test/check-socle.js
      - name: Simulation courte de la présidentielle
        run: node test/simulate.js 20
      - name: Simulation courte du quinquennat (3 stratégies)
        run: |
          node test/govern-sim.js 5 a
          node test/govern-sim.js 5 b
          node test/govern-sim.js 5 c
      - name: Simulation courte des législatives
        run: node test/legis-sim.js 10
      - name: Simulation courte de l'opposition
        run: node test/oppo-sim.js 5
      - name: Simulation courte avec un parti fondé
        run: node test/perso-sim.js 10
      - name: Contrôle des fiches (hors ligne)
        run: node test/check-sources.js
      - name: Ouverture de chaque lien officiel
        run: node test/check-sources.js --online
